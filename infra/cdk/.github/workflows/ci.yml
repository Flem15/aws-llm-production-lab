name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/demo-inference-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test --if-present
