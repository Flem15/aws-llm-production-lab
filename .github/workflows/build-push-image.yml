name: Build and Push Immutable Images
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type development-publication to confirm this action
        required: true
        type: string
      evidence_run_id:
        description: Reviewed successful producer run on this exact main revision
        required: true
        type: string
      evidence_sha256:
        description: Reviewed approved-release-evidence archive SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: ecr-image-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-pinned provenance verifier
        run: bash .github/scripts/install_verified_gh.sh
      - name: Verify live GitHub release protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN || github.token }}
          RELEASE_ACTION: publication
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_REGION: ${{ vars.AWS_REGION }}
          RELEASE_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: python3 .github/scripts/release_authorization.py
      - name: Authenticate and download approved review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run_id }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
        run: python3 .github/scripts/publication_evidence.py "${GITHUB_SHA}" "${EVIDENCE_RUN}" "${EVIDENCE_SHA256}" release-review
      - name: Verify all signed evidence before obtaining AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/produce_publication_evidence.py verify "${GITHUB_SHA}" release-review
      - name: Recheck publication evidence gate
        run: python3 .github/scripts/predeployment_gate.py release-review/gate-input.json --stage publication --source-revision "${GITHUB_SHA}"
      - name: Install digest-preserving registry transport
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: llm-parity-image-${{ github.run_id }}
          aws-region: us-east-2
          allowed-account-ids: '655469962246'
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
              {"Effect":"Allow","Action":["ecr:BatchCheckLayerAvailability","ecr:BatchGetImage","ecr:CompleteLayerUpload","ecr:DescribeImages","ecr:GetDownloadUrlForLayer","ecr:InitiateLayerUpload","ecr:PutImage","ecr:UploadLayerPart"],"Resource":["arn:aws:ecr:us-east-2:655469962246:repository/demo-inference-api","arn:aws:ecr:us-east-2:655469962246:repository/bot-city-dev","arn:aws:ecr:us-east-2:655469962246:repository/bot-city-proxy-dev"]}
            ]}
      - name: Verify development account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 655469962246
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2
      - name: Publish only the approved archives and verify registry provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_approved_images.py "${GITHUB_SHA}" release-review published-evidence
      - name: Retain registry verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-release-evidence-${{ github.sha }}-${{ github.run_id }}
          path: published-evidence/
          if-no-files-found: error
