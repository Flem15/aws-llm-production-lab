name: Deploy Immutable ECS Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type development-deployment to confirm this action
        required: true
        type: string
      evidence_run_id:
        description: Approved review run containing approved-release-evidence
        required: true
        type: string
      image_tag:
        description: Full 40-character Git SHA already present in ECR
        required: true
        type: string
      return_to_zero:
        description: Scale the ECS service back to zero after validation
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ecs-dev-release
  cancel-in-progress: false

env:
  ECS_CLUSTER: llm-parity-cluster
  ECS_SERVICE: llm-parity-demo-inference-service
  ECR_REPOSITORY: demo-inference-api
  ALB_NAME: llm-parity-private-alb
  EVIDENCE_DIR: release-evidence

jobs:
  deploy:
    name: Deploy and Validate
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize release evidence
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          mkdir -p "${EVIDENCE_DIR}"

          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow_branch=${GITHUB_REF_NAME}"
            echo "requested_image_tag=${IMAGE_TAG}"
            echo "return_to_zero=${{ inputs.return_to_zero }}"
            echo "started_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: release evidence initialized"

      - name: Validate immutable image tag input
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: image_tag must be a full lowercase 40-character Git SHA"
            exit 1
          fi

          echo "PASS: immutable image tag format is valid"

      - name: Enforce main branch release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ERROR: releases may only run from the main branch"
            exit 1
          fi

          echo "PASS: workflow is running from main"

      - name: Verify live GitHub release protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN || github.token }}
          RELEASE_ACTION: deployment
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_REGION: ${{ vars.AWS_REGION }}
          RELEASE_ROLE: ${{ vars.AWS_ROLE_ARN }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: python3 .github/scripts/release_authorization.py

      - name: Download approved review evidence
        uses: actions/download-artifact@v4
        with:
          name: approved-release-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: release-review

      - name: Require current predeployment evidence
        run: python3 .github/scripts/predeployment_gate.py release-review/gate-input.json --stage deployment --source-revision "${GITHUB_SHA}"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: llm-parity-release-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify development AWS account
        shell: bash
        env:
          EXPECTED_AWS_ACCOUNT: '655469962246'
        run: |
          set -euo pipefail

          ACTUAL_AWS_ACCOUNT=$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )

          if [ "${ACTUAL_AWS_ACCOUNT}" != "${EXPECTED_AWS_ACCOUNT}" ]; then
            echo "ERROR: AWS account mismatch; refusing deployment"
            exit 1
          fi

          echo "PASS: AWS account matches the approved development account"

      - name: Log in for digest and attestation verification
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve and verify signed release digest
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" --region "${{ vars.AWS_REGION }}" \
            > "${EVIDENCE_DIR}/image-details.json"
          DIGEST=$(python3 .github/scripts/verify_release.py "${IMAGE_TAG}" \
            "${EVIDENCE_DIR}/image-details.json" "${EVIDENCE_DIR}/provenance.json" --review release-review/gate-input.json)
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Capture previous ECS state
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_TASK_DEFINITION=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].taskDefinition" \
              --output text
          )

          PREVIOUS_DESIRED_COUNT=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].desiredCount" \
              --output text
          )

          if [ -z "${PREVIOUS_TASK_DEFINITION}" ] ||
             [ "${PREVIOUS_TASK_DEFINITION}" = "None" ]; then
            echo "ERROR: previous task definition could not be captured"
            exit 1
          fi

          if ! [[ "${PREVIOUS_DESIRED_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: previous desired count is invalid"
            exit 1
          fi

          echo "task_definition=${PREVIOUS_TASK_DEFINITION}" \
            >> "${GITHUB_OUTPUT}"

          echo "desired_count=${PREVIOUS_DESIRED_COUNT}" \
            >> "${GITHUB_OUTPUT}"

          {
            echo "previous_desired_count=${PREVIOUS_DESIRED_COUNT}"
            echo "previous_task_definition_captured=true"
          } >> "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: previous ECS state captured"

      - name: Prepare immutable task definition
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.previous.outputs.task_definition }}
          IMAGE_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${PREVIOUS_TASK_DEFINITION}" \
            > "${EVIDENCE_DIR}/previous-task.json"
          python3 .github/scripts/prepare-ecs-release.py \
            "${EVIDENCE_DIR}/previous-task.json" "${IMAGE_TAG}" "${IMAGE_DIGEST}" \
            > "${EVIDENCE_DIR}/next-task.json"

      - name: Deploy immutable task definition
        id: deploy_release
        run: |
          set -euo pipefail
          NEXT_TASK=$(aws ecs register-task-definition \
            --cli-input-json "file://${EVIDENCE_DIR}/next-task.json" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "started=true" >> "${GITHUB_OUTPUT}"
          aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${ECS_SERVICE}" \
            --task-definition "${NEXT_TASK}" > "${EVIDENCE_DIR}/release-outputs.json"

      - name: Scale service to one for validation
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --desired-count 1 \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null

          echo "PASS: ECS service scaled to one for validation"

      - name: Wait for ECS deployment stability
        timeout-minutes: 15
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${{ vars.AWS_REGION }}"

          echo "PASS: ECS service reached a stable state"

      - name: Verify deployed task uses requested image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXPECTED_IMAGE: 655469962246.dkr.ecr.us-east-2.amazonaws.com/demo-inference-api@${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail

          ACTIVE_TASK_DEFINITION=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].taskDefinition" \
              --output text
          )

          ACTIVE_IMAGE=$(
            aws ecs describe-task-definition \
              --task-definition "${ACTIVE_TASK_DEFINITION}" \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "taskDefinition.containerDefinitions[?name=='demo-inference-api'].image | [0]" \
              --output text
          )

          if [ "${ACTIVE_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
            echo "ERROR: active task definition does not match the verified digest"
            exit 1
          fi
          echo "PASS: active task definition uses the verified image digest"

      - name: Verify ALB target health
        timeout-minutes: 10
        run: |
          set -euo pipefail

          LOAD_BALANCER_ARN=$(
            aws elbv2 describe-load-balancers \
              --names "${ALB_NAME}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text
          )

          TARGET_GROUP_ARN=$(
            aws elbv2 describe-target-groups \
              --load-balancer-arn "${LOAD_BALANCER_ARN}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text
          )

          aws elbv2 wait target-in-service \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --region "${{ vars.AWS_REGION }}"

          echo "PASS: ALB target is healthy"

      - name: Validate release through API Gateway
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          API_ID=$(
            aws apigatewayv2 get-apis \
              --region "${{ vars.AWS_REGION }}" \
              --query "Items[?Name=='llm-parity-http-api'].ApiId | [0]" \
              --output text
          )

          API_ENDPOINT=$(
            aws apigatewayv2 get-api \
              --api-id "${API_ID}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "ApiEndpoint" \
              --output text
          )

          HEALTH_RESPONSE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              "${API_ENDPOINT}/health"
          )

          export HEALTH_RESPONSE

          node -e '
            const response = JSON.parse(process.env.HEALTH_RESPONSE);
            const expected = process.env.IMAGE_TAG;

            if (response.status !== "ok") {
              throw new Error(
                `Expected health status ok, received ${response.status}`
              );
            }

            if (response.version !== expected) {
              throw new Error(
                `Expected version ${expected}, received ${response.version}`
              );
            }

            console.log(
              "PASS: API health response matches immutable release SHA"
            );
          '

      - name: Validate authenticated inference through API Gateway
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          API_ID=$(
            aws apigatewayv2 get-apis \
              --region "${AWS_REGION}" \
              --query "Items[?Name=='llm-parity-http-api'].ApiId | [0]" \
              --output text
          )

          test -n "${API_ID}" && \
          test "${API_ID}" != "None" && \
          echo "PASS: API ID captured for authenticated validation"

          API_ENDPOINT=$(
            aws apigatewayv2 get-api \
              --api-id "${API_ID}" \
              --region "${AWS_REGION}" \
              --query "ApiEndpoint" \
              --output text
          )

          [[ "${API_ENDPOINT}" == https://* ]] && \
          echo "PASS: API endpoint captured for authenticated validation"

          export API_ENDPOINT

          python3 \
            .github/scripts/validate-api-auth.py && \
          echo "PASS: API authorization control validated end to end"

      - name: Roll back failed release
        id: rollback
        if: ${{ failure() && steps.deploy_release.outputs.started == 'true' && steps.previous.outputs.task_definition != '' }}
        shell: bash
        env:
          PREVIOUS_TASK_DEFINITION:
            ${{ steps.previous.outputs.task_definition }}
          PREVIOUS_DESIRED_COUNT:
            ${{ steps.previous.outputs.desired_count }}
        run: |
          set -euo pipefail

          echo "Release validation failed; restoring previous task definition."

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION}" \
            --desired-count "${PREVIOUS_DESIRED_COUNT}" \
            --deployment-configuration \
              "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null

          echo "requested=true" >> "${GITHUB_OUTPUT}"
          echo "PASS: rollback request submitted"

      - name: Enforce final ECS capacity
        id: cleanup
        if: ${{ always() && steps.deploy_release.outputs.started == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_SCALE_TO_ZERO="false"

          if [ "${{ job.status }}" != "success" ]; then
            SHOULD_SCALE_TO_ZERO="true"
          elif [ "${{ inputs.return_to_zero }}" = "true" ]; then
            SHOULD_SCALE_TO_ZERO="true"
          fi

          if [ "${SHOULD_SCALE_TO_ZERO}" = "true" ]; then
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${ECS_SERVICE}" \
              --desired-count 0 \
              --region "${{ vars.AWS_REGION }}" \
              >/dev/null

            echo "scaled_to_zero=true" >> "${GITHUB_OUTPUT}"
            echo "PASS: final ECS desired count set to zero"
          else
            echo "scaled_to_zero=false" >> "${GITHUB_OUTPUT}"
            echo "INFO: validated service intentionally left running"
          fi

      - name: Collect release diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          mkdir -p "${EVIDENCE_DIR}"

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${{ vars.AWS_REGION }}" \
            --query \
            "services[0].{
              status:status,
              desiredCount:desiredCount,
              runningCount:runningCount,
              pendingCount:pendingCount,
              taskDefinition:taskDefinition,
              deployments:deployments[*].{
                status:status,
                rolloutState:rolloutState,
                desiredCount:desiredCount,
                runningCount:runningCount,
                pendingCount:pendingCount,
                failedTasks:failedTasks,
                reason:rolloutStateReason
              },
              events:events[0:20].{
                createdAt:createdAt,
                message:message
              }
            }" \
            --output json \
            > "${EVIDENCE_DIR}/ecs-service.json"

          STOPPED_TASKS=$(
            aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --region "${{ vars.AWS_REGION }}" \
              --query "taskArns[0:10]" \
              --output text
          )

          if [ -n "${STOPPED_TASKS}" ]; then
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${STOPPED_TASKS} \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "tasks[*].{
                lastStatus:lastStatus,
                healthStatus:healthStatus,
                stopCode:stopCode,
                stoppedReason:stoppedReason,
                containerStatus:containers[0].lastStatus,
                containerHealth:containers[0].healthStatus,
                containerReason:containers[0].reason,
                exitCode:containers[0].exitCode
              }" \
              --output json \
              > "${EVIDENCE_DIR}/stopped-tasks.json"
          else
            echo '[]' > "${EVIDENCE_DIR}/stopped-tasks.json"
          fi

          LOAD_BALANCER_ARN=$(
            aws elbv2 describe-load-balancers \
              --names "${ALB_NAME}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text
          )

          TARGET_GROUP_ARN=$(
            aws elbv2 describe-target-groups \
              --load-balancer-arn "${LOAD_BALANCER_ARN}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text
          )

          aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --region "${{ vars.AWS_REGION }}" \
            --query \
            "TargetHealthDescriptions[*].{
              port:Target.Port,
              state:TargetHealth.State,
              reason:TargetHealth.Reason,
              description:TargetHealth.Description
            }" \
            --output json \
            > "${EVIDENCE_DIR}/alb-target-health.json"

          {
            echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "job_status=${{ job.status }}"
            echo "rollback_requested=${{ steps.rollback.outputs.requested || 'false' }}"
            echo "scaled_to_zero=${{ steps.cleanup.outputs.scaled_to_zero || 'false' }}"
          } >> "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: release diagnostics collected"

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ecs-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          FINAL_STATE=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "services[0].[status,desiredCount,runningCount,pendingCount]" \
              --output text 2>/dev/null ||
            echo "unavailable"
          )

          {
            echo "# Immutable ECS release"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow result | \`${{ job.status }}\` |"
            echo "| Workflow branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Requested image | \`${IMAGE_TAG}\` |"
            echo "| Previous desired count | \`${{ steps.previous.outputs.desired_count || 'not captured' }}\` |"
            echo "| Rollback requested | \`${{ steps.rollback.outputs.requested || 'false' }}\` |"
            echo "| Final scale to zero | \`${{ steps.cleanup.outputs.scaled_to_zero || 'false' }}\` |"
            if [ -f "${EVIDENCE_DIR}/api-auth-validation.json" ]; then
              echo "| API IAM validation | \`passed\` |"
            else
              echo "| API IAM validation | \`not completed\` |"
            fi
            echo "| Evidence artifact | \`ecs-release-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\` |"
            echo
            echo "## Final ECS state"
            echo
            echo "\`${FINAL_STATE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
