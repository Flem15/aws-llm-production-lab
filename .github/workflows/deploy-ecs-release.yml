name: Deploy Immutable ECS Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character Git SHA already present in ECR
        required: true
        type: string
      return_to_zero:
        description: Scale the ECS service back to zero after validation
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-dev-release
  cancel-in-progress: false

env:
  ECS_CLUSTER: llm-parity-cluster
  ECS_SERVICE: llm-parity-demo-inference-service
  ECR_REPOSITORY: demo-inference-api
  ALB_NAME: llm-parity-private-alb
  CDK_STACK: LlmParityDevFargateServiceStack
  EVIDENCE_DIR: release-evidence

jobs:
  deploy:
    name: Deploy and Validate
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize release evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${EVIDENCE_DIR}"

          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow_branch=${GITHUB_REF_NAME}"
            echo "requested_image_tag=${{ inputs.image_tag }}"
            echo "return_to_zero=${{ inputs.return_to_zero }}"
            echo "started_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: release evidence initialized"

      - name: Validate immutable image tag input
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: image_tag must be a full lowercase 40-character Git SHA"
            exit 1
          fi

          echo "PASS: immutable image tag format is valid"

      - name: Enforce main branch release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ERROR: releases may only run from the main branch"
            exit 1
          fi

          echo "PASS: workflow is running from main"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: llm-parity-release-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify immutable image exists
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null

          echo "PASS: immutable ECR image exists"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Build CDK application
        working-directory: infra/cdk
        run: npm run build

      - name: Capture previous ECS state
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_TASK_DEFINITION=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].taskDefinition" \
              --output text
          )

          PREVIOUS_DESIRED_COUNT=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].desiredCount" \
              --output text
          )

          if [ -z "${PREVIOUS_TASK_DEFINITION}" ] ||
             [ "${PREVIOUS_TASK_DEFINITION}" = "None" ]; then
            echo "ERROR: previous task definition could not be captured"
            exit 1
          fi

          if ! [[ "${PREVIOUS_DESIRED_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: previous desired count is invalid"
            exit 1
          fi

          echo "task_definition=${PREVIOUS_TASK_DEFINITION}" \
            >> "${GITHUB_OUTPUT}"

          echo "desired_count=${PREVIOUS_DESIRED_COUNT}" \
            >> "${GITHUB_OUTPUT}"

          {
            echo "previous_desired_count=${PREVIOUS_DESIRED_COUNT}"
            echo "previous_task_definition_captured=true"
          } >> "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: previous ECS state captured"

      - name: Preview immutable release
        working-directory: infra/cdk
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          npx aws-cdk diff "${CDK_STACK}" \
            -c imageTag="${IMAGE_TAG}" \
            | tee "../../${EVIDENCE_DIR}/cdk-diff.txt"

      - name: Deploy immutable task definition
        working-directory: infra/cdk
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          npx aws-cdk deploy "${CDK_STACK}" \
            -c imageTag="${IMAGE_TAG}" \
            --require-approval never \
            --outputs-file /tmp/release-outputs.json

          cp \
            /tmp/release-outputs.json \
            "../../${EVIDENCE_DIR}/release-outputs.json"

      - name: Scale service to one for validation
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --desired-count 1 \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null

          echo "PASS: ECS service scaled to one for validation"

      - name: Wait for ECS deployment stability
        timeout-minutes: 15
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${{ vars.AWS_REGION }}"

          echo "PASS: ECS service reached a stable state"

      - name: Verify deployed task uses requested image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          ACTIVE_TASK_DEFINITION=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "services[0].taskDefinition" \
              --output text
          )

          ACTIVE_IMAGE=$(
            aws ecs describe-task-definition \
              --task-definition "${ACTIVE_TASK_DEFINITION}" \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "taskDefinition.containerDefinitions[?name=='demo-inference-api'].image | [0]" \
              --output text
          )

          case "${ACTIVE_IMAGE}" in
            *":${IMAGE_TAG}")
              echo "PASS: ECS task definition uses requested immutable image"
              ;;
            *)
              echo "ERROR: ECS task definition does not use requested image"
              exit 1
              ;;
          esac

      - name: Verify ALB target health
        timeout-minutes: 10
        run: |
          set -euo pipefail

          LOAD_BALANCER_ARN=$(
            aws elbv2 describe-load-balancers \
              --names "${ALB_NAME}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text
          )

          TARGET_GROUP_ARN=$(
            aws elbv2 describe-target-groups \
              --load-balancer-arn "${LOAD_BALANCER_ARN}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text
          )

          aws elbv2 wait target-in-service \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --region "${{ vars.AWS_REGION }}"

          echo "PASS: ALB target is healthy"

      - name: Validate release through API Gateway
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          API_ID=$(
            aws apigatewayv2 get-apis \
              --region "${{ vars.AWS_REGION }}" \
              --query "Items[?Name=='llm-parity-http-api'].ApiId | [0]" \
              --output text
          )

          API_ENDPOINT=$(
            aws apigatewayv2 get-api \
              --api-id "${API_ID}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "ApiEndpoint" \
              --output text
          )

          HEALTH_RESPONSE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              "${API_ENDPOINT}/health"
          )

          export HEALTH_RESPONSE

          node -e '
            const response = JSON.parse(process.env.HEALTH_RESPONSE);
            const expected = process.env.IMAGE_TAG;

            if (response.status !== "ok") {
              throw new Error(
                `Expected health status ok, received ${response.status}`
              );
            }

            if (response.version !== expected) {
              throw new Error(
                `Expected version ${expected}, received ${response.version}`
              );
            }

            console.log(
              "PASS: API health response matches immutable release SHA"
            );
          '

      - name: Roll back failed release
        id: rollback
        if: ${{ failure() && steps.previous.outputs.task_definition != '' }}
        shell: bash
        env:
          PREVIOUS_TASK_DEFINITION:
            ${{ steps.previous.outputs.task_definition }}
          PREVIOUS_DESIRED_COUNT:
            ${{ steps.previous.outputs.desired_count }}
        run: |
          set -euo pipefail

          echo "Release validation failed; restoring previous task definition."

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION}" \
            --desired-count "${PREVIOUS_DESIRED_COUNT}" \
            --deployment-configuration \
              "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null

          echo "requested=true" >> "${GITHUB_OUTPUT}"
          echo "PASS: rollback request submitted"

      - name: Enforce final ECS capacity
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_SCALE_TO_ZERO="false"

          if [ "${{ job.status }}" != "success" ]; then
            SHOULD_SCALE_TO_ZERO="true"
          elif [ "${{ inputs.return_to_zero }}" = "true" ]; then
            SHOULD_SCALE_TO_ZERO="true"
          fi

          if [ "${SHOULD_SCALE_TO_ZERO}" = "true" ]; then
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${ECS_SERVICE}" \
              --desired-count 0 \
              --region "${{ vars.AWS_REGION }}" \
              >/dev/null

            echo "scaled_to_zero=true" >> "${GITHUB_OUTPUT}"
            echo "PASS: final ECS desired count set to zero"
          else
            echo "scaled_to_zero=false" >> "${GITHUB_OUTPUT}"
            echo "INFO: validated service intentionally left running"
          fi

      - name: Collect release diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          mkdir -p "${EVIDENCE_DIR}"

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${{ vars.AWS_REGION }}" \
            --query \
            "services[0].{
              status:status,
              desiredCount:desiredCount,
              runningCount:runningCount,
              pendingCount:pendingCount,
              taskDefinition:taskDefinition,
              deployments:deployments[*].{
                status:status,
                rolloutState:rolloutState,
                desiredCount:desiredCount,
                runningCount:runningCount,
                pendingCount:pendingCount,
                failedTasks:failedTasks,
                reason:rolloutStateReason
              },
              events:events[0:20].{
                createdAt:createdAt,
                message:message
              }
            }" \
            --output json \
            > "${EVIDENCE_DIR}/ecs-service.json"

          STOPPED_TASKS=$(
            aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --region "${{ vars.AWS_REGION }}" \
              --query "taskArns[0:10]" \
              --output text
          )

          if [ -n "${STOPPED_TASKS}" ]; then
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${STOPPED_TASKS} \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "tasks[*].{
                lastStatus:lastStatus,
                healthStatus:healthStatus,
                stopCode:stopCode,
                stoppedReason:stoppedReason,
                containerStatus:containers[0].lastStatus,
                containerHealth:containers[0].healthStatus,
                containerReason:containers[0].reason,
                exitCode:containers[0].exitCode
              }" \
              --output json \
              > "${EVIDENCE_DIR}/stopped-tasks.json"
          else
            echo '[]' > "${EVIDENCE_DIR}/stopped-tasks.json"
          fi

          LOAD_BALANCER_ARN=$(
            aws elbv2 describe-load-balancers \
              --names "${ALB_NAME}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text
          )

          TARGET_GROUP_ARN=$(
            aws elbv2 describe-target-groups \
              --load-balancer-arn "${LOAD_BALANCER_ARN}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text
          )

          aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --region "${{ vars.AWS_REGION }}" \
            --query \
            "TargetHealthDescriptions[*].{
              port:Target.Port,
              state:TargetHealth.State,
              reason:TargetHealth.Reason,
              description:TargetHealth.Description
            }" \
            --output json \
            > "${EVIDENCE_DIR}/alb-target-health.json"

          {
            echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "job_status=${{ job.status }}"
            echo "rollback_requested=${{ steps.rollback.outputs.requested || 'false' }}"
            echo "scaled_to_zero=${{ steps.cleanup.outputs.scaled_to_zero || 'false' }}"
          } >> "${EVIDENCE_DIR}/release-metadata.txt"

          echo "PASS: release diagnostics collected"

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ecs-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        run: |
          FINAL_STATE=$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${{ vars.AWS_REGION }}" \
              --query \
              "services[0].[status,desiredCount,runningCount,pendingCount]" \
              --output text 2>/dev/null ||
            echo "unavailable"
          )

          {
            echo "# Immutable ECS release"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow result | \`${{ job.status }}\` |"
            echo "| Workflow branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Requested image | \`${{ inputs.image_tag }}\` |"
            echo "| Previous desired count | \`${{ steps.previous.outputs.desired_count || 'not captured' }}\` |"
            echo "| Rollback requested | \`${{ steps.rollback.outputs.requested || 'false' }}\` |"
            echo "| Final scale to zero | \`${{ steps.cleanup.outputs.scaled_to_zero || 'false' }}\` |"
            echo "| Evidence artifact | \`ecs-release-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\` |"
            echo
            echo "## Final ECS state"
            echo
            echo "\`${FINAL_STATE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
