name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/github-oidc-cicd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/demo-inference-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/demo-inference-api/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build local Docker image
        run: |
          docker build \
            --tag demo-inference-api:ci-${GITHUB_SHA} \
            .

  infrastructure:
    name: CDK Build and Synthesis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci

      - name: Build CDK application
        run: npm run build

      - name: List CDK stacks
        run: npx aws-cdk list

      - name: Synthesize CDK application
        run: npx aws-cdk synth --quiet
