<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot City</title>
<style>
  :root {
    --bg: #0b0820; --panel: #151036; --line: #2c2463; --text: #e9e6ff; --dim: #8f88c4;
    --green: #3df5a0; --red: #ff4f7a; --gold: #ffcf4a; --cyan: #5ee7ff; --violet: #a46bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #2a1670 0%, var(--bg) 60%); background-color: var(--bg);
         color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .18em; font-weight: 800; color: var(--cyan); text-shadow: 0 0 18px #5ee7ff88; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .pill.paper { color: var(--cyan); border-color: #5ee7ff66; }
  .pill.LIVE { color: #fff; background: var(--red); border-color: var(--red); }
  .vault { margin: 22px auto 18px; text-align: center; padding: 18px; border: 1px solid #ffcf4a55; border-radius: 16px;
           background: linear-gradient(180deg, #1d1446, #120d2e); max-width: 420px; box-shadow: 0 0 40px #ffcf4a1a; }
  .vault small { letter-spacing: .3em; color: var(--gold); font-weight: 700; font-size: 11px; }
  .vault .amt { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .vault .sub { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--violet); }
  .card.on::before { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .card.trade::before { background: var(--gold); box-shadow: 0 0 12px var(--gold); }
  .card.off::before { background: var(--dim); }
  .card h3 { margin: 0; font-size: 15px; letter-spacing: .08em; display: flex; justify-content: space-between; }
  .meta { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .status { font-size: 12px; font-weight: 600; }
  .big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pos { margin-top: 8px; font-size: 12px; padding: 8px; border-radius: 8px; background: #0e0a26; border: 1px dashed #ffcf4a55; }
  .thoughts { margin-top: 8px; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c9c3f5; max-height: 132px; overflow: auto; }
  .thoughts div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thoughts b { color: var(--dim); font-weight: 400; margin-right: 6px; }
  .g { color: var(--green); } .r { color: var(--red); } .gold { color: var(--gold); } .d { color: var(--dim); }
  section { margin-top: 22px; }
  section h2 { font-size: 12px; letter-spacing: .3em; color: var(--gold); margin: 0 0 10px; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 13px; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .1em; }
  td.n, th.n { text-align: right; }
  .bars { display: flex; align-items: center; gap: 3px; height: 140px; padding: 12px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 14px; position: relative; }
  .bars .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .bars .b { width: 100%; border-radius: 3px 3px 0 0; }
  .bars .up { background: var(--green); box-shadow: 0 0 8px #3df5a066; }
  .bars .dn { background: var(--red); border-radius: 0 0 3px 3px; }
  .chartcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 6px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .tab { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--dim); background: transparent;
         border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .tab.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
  .legend { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  #chart { width: 100%; height: 300px; display: block; overflow: visible; }
  #chart text { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty { color: var(--dim); padding: 16px; text-align: center; }
  footer { margin-top: 26px; color: var(--dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BOT CITY</h1>
    <a href="analytics.html" style="color:var(--cyan)">Trade intelligence →</a>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span id="mode" class="pill">—</span><span id="market" class="pill">connecting…</span>
    </div>
  </header>

  <div class="vault">
    <small id="vaultLabel">THE VAULT · TODAY</small>
    <div class="amt" id="vault">$0</div>
    <div class="sub" id="vaultSub">waiting for state.json…</div>
  </div>

  <div class="grid" id="workers"></div>

  <section id="chartSec" hidden>
    <h2 id="chartTitle">PRICE · VWAP · EMA9</h2>
    <div class="chartcard">
      <div class="tabs" id="tabs"></div>
      <svg id="chart" role="img" aria-label="Price chart with trades"></svg>
    </div>
  </section>

  <section id="daysSec" hidden>
    <h2>DAILY P&amp;L</h2>
    <div class="bars" id="days"></div>
  </section>

  <section>
    <h2>PAYROLL</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>WORKER</th><th class="n">TRADES</th><th class="n">WINS</th><th class="n">WIN %</th><th class="n">EARNED</th></tr></thead>
      <tbody id="payroll"></tbody>
    </table></div>
  </section>

  <section>
    <h2>RECENT TRADES</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>TIME</th><th>WORKER</th><th>CONTRACT</th><th class="n">QTY</th><th class="n">IN</th><th class="n">OUT</th><th class="n">P&amp;L</th><th class="n">RETURN</th><th>HOW IT CLOSED</th></tr></thead>
      <tbody id="trades"></tbody>
    </table></div>
  </section>

  <footer>Updates every 5s · <span id="updated"></span></footer>
</div>
<script>
const $ = id => document.getElementById(id);
const money = v => (v >= 0 ? "+$" : "−$") + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits: 0});
const cls = v => v > 0 ? "g" : v < 0 ? "r" : "d";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = iso => (iso || "").slice(11, 16);

function render(s) {
  $("mode").textContent = (s.mode || "").toUpperCase();
  $("mode").className = "pill " + s.mode;
  $("market").textContent = "market " + (s.market || "—");
  const backtest = s.mode === "backtest";
  const total = backtest ? s.vault_total : s.vault_today;
  $("vaultLabel").textContent = backtest ? `THE VAULT · ${Object.keys(s.days || {}).length} TRADING DAYS (BACKTEST)` : "THE VAULT · TODAY";
  $("vault").textContent = money(total || 0);
  $("vault").className = "amt " + cls(total);
  const on = s.workers.filter(w => !w.off).length;
  $("vaultSub").textContent = `${s.workers.length} workers · ${on} on shift`;

  $("workers").innerHTML = s.workers.map(w => {
    const state = w.off ? "off" : w.position ? "trade" : "on";
    const p = w.position;
    return `<div class="card ${state}">
      <h3>${esc(w.name)} <span class="${cls(w.pnl)}">${money(w.pnl)}</span></h3>
      <div class="meta">${esc(w.symbol)} · ${esc(w.strategy.replace("_", " "))} · ${w.trades} trades · ${w.wins} wins</div>
      <div class="status ${w.off ? "d" : p ? "gold" : "g"}">● ${esc(w.status)}</div>
      <div class="meta">${w.brake == null ? "no brake" : "brake " + money(w.brake)} · ${w.lock ? "profit lock " + Math.round(w.lock * 100) + "% · day peak " + money(w.peak || 0) : "no lock"}</div>
      ${p ? `<div class="pos">${esc(p.side)} ×${p.qty} · ${esc(p.contract)}<br>in @ ${p.entry.toFixed(2)} since ${esc(p.since)} · now ${(p.mark || p.entry).toFixed(2)} ·
        <b class="${cls(p.open_pnl)}">open ${money(p.open_pnl || 0)}</b></div>` : ""}
      <div class="thoughts">${(w.thoughts || []).slice().reverse().map(([t, x]) => `<div title="${esc(x)}"><b>${esc(t)}</b>${esc(x)}</div>`).join("") || '<div class="d">no thoughts yet</div>'}</div>
    </div>`;
  }).join("");

  // payroll: backtests send totals across all days; live uses today's numbers
  const agg = s.payroll || Object.fromEntries(s.workers.map(w => [w.name, {t: w.trades, w: w.wins, p: w.pnl}]));
  $("payroll").innerHTML = Object.entries(agg).sort((a, b) => b[1].p - a[1].p).map(([n, a], i) =>
    `<tr><td>${i === 0 && a.p > 0 ? "👑 " : ""}${esc(n)}</td><td class="n">${a.t}</td><td class="n">${a.w}</td>
     <td class="n">${a.t ? Math.round(100 * a.w / a.t) + "%" : "—"}</td><td class="n ${cls(a.p)}">${money(a.p)}</td></tr>`).join("");

  const tr = (s.trades || []).slice().reverse();
  $("trades").innerHTML = tr.length ? tr.map(t => `<tr>
    <td>${hhmm(t.entry_time)}→${hhmm(t.exit_time)}</td><td>${esc(t.worker)}</td><td>${esc(t.contract)}</td>
    <td class="n">${t.qty}</td><td class="n">${(+t.entry_price).toFixed(2)}</td><td class="n">${(+t.exit_price).toFixed(2)}</td>
    <td class="n ${cls(t.pnl)}">${money(+t.pnl)}</td><td class="n ${cls(t.return_pct)}">${(100 * t.return_pct).toFixed(1)}%</td>
    <td>${t.pnl > 0 ? "✅" : "🔴"} ${esc(t.exit_reason)}</td></tr>`).join("")
    : `<tr><td colspan="9" class="empty">No closed trades today yet.</td></tr>`;

  const days = s.days || null;
  $("daysSec").hidden = !days;
  if (days) {
    const vals = Object.values(days), max = Math.max(1, ...vals.map(Math.abs));
    $("days").innerHTML = Object.entries(days).map(([d, v]) => {
      const h = 50 * Math.abs(v) / max;
      return `<div class="col" title="${d}: ${money(v)}">
        <div style="height:50%;display:flex;align-items:flex-end">${v > 0 ? `<div class="b up" style="height:${2*h}%"></div>` : ""}</div>
        <div style="height:50%;display:flex;align-items:flex-start">${v < 0 ? `<div class="b dn" style="height:${2*h}%"></div>` : ""}</div></div>`;
    }).join("");
  }
  drawChart(s);
  $("updated").textContent = "last update " + new Date(s.updated).toLocaleString();
}


// ── price chart with trade markers ──
const WCOL = ["#5ee7ff", "#a46bff", "#ffcf4a", "#ff9de2", "#9dffcb"];
let chartSym = null;
function drawChart(s) {
  const charts = s.charts || {};
  const syms = Object.keys(charts).filter(k => charts[k]);
  $("chartSec").hidden = !syms.length;
  if (!syms.length) return;
  if (!syms.includes(chartSym)) chartSym = syms.includes("QQQ") ? "QQQ" : syms[0];
  const wcol = {}; s.workers.forEach((w, i) => wcol[w.name] = WCOL[i % WCOL.length]);
  const mine = s.workers.filter(w => w.symbol === chartSym);
  $("tabs").innerHTML = syms.map(k => `<button class="tab ${k === chartSym ? "on" : ""}" data-s="${esc(k)}">${esc(k)}</button>`).join("") +
    `<span class="legend"><span><i style="background:var(--green)"></i>price</span><span><i style="background:#ffa63d"></i>VWAP</span>
     <span><i style="background:#c9c3f5"></i>EMA9</span>${mine.map(w => `<span><i style="background:${wcol[w.name]}"></i>${esc(w.name)}</span>`).join("")}</span>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { chartSym = b.dataset.s; drawChart(s); });

  const svg = $("chart"), W = Math.max(280, Math.round(svg.getBoundingClientRect().width || 1000)), H = W < 600 ? 240 : 300;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px";
  const c = charts[chartSym], n = c.t.length, padL = 8, padR = 52, padT = 26, padB = 22;
  $("chartTitle").textContent = `${chartSym} · ${c.day} · PRICE · VWAP · EMA9`;
  const all = c.close.concat(c.vwap, c.ema9), lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || 1;
  const X = i => padL + (W - padL - padR) * (n > 1 ? i / (n - 1) : 0.5);
  const Y = v => padT + (H - padT - padB) * (1 - (v - lo) / span);
  const line = (arr, col, dash, w) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash ? 'stroke-dasharray="5 4"' : ""}
     vector-effect="non-scaling-stroke" points="${arr.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ")}"/>`;
  const idx = {}; c.t.forEach((t, i) => idx[t] = i);
  const at = iso => { const k = hhmm(iso); return k in idx ? idx[k] : null; };
  let out = "";
  for (let k = 0; k <= 4; k++) {               // gridlines + price labels
    const v = lo + span * k / 4, y = Y(v);
    out += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="#2c2463" vector-effect="non-scaling-stroke"/>
            <text x="${W - padR + 6}" y="${y + 3}" fill="#8f88c4">${v.toFixed(2)}</text>`;
  }
  const every = W < 600 ? ["10:00", "12:00", "14:00"] : null;
  c.t.forEach((t, i) => { if (t.endsWith(":00") && (!every || every.includes(t))) out += `<text x="${X(i) - 14}" y="${H - 6}" fill="#8f88c4">${t}</text>`; });
  out += line(c.vwap, "#ffa63d", false, 2) + line(c.ema9, "#c9c3f5", true, 1.2) + line(c.close, "#3df5a0", false, 1.8);

  const names = new Set(mine.map(w => w.name));
  const tri = (x, y, up, col) => up ? `<path d="M${x},${y - 7} l6,10 h-12 z" fill="${col}" stroke="#0b0820"/>`
                                    : `<path d="M${x},${y + 7} l6,-10 h-12 z" fill="${col}" stroke="#0b0820"/>`;
  (s.trades || []).filter(t => names.has(t.worker)).forEach(t => {
    const i = at(t.entry_time), j = at(t.exit_time), col = wcol[t.worker], call = t.side === "CALL";
    if (i !== null) out += tri(X(i), Y(c.close[i]) + (call ? 10 : -10), call, col);
    if (j !== null) {
      const x = X(j), y = Y(c.close[j]), good = t.pnl > 0, lbl = money(+t.pnl);
      if (i !== null) out += `<line x1="${X(i)}" y1="${Y(c.close[i])}" x2="${x}" y2="${y}" stroke="${col}" stroke-dasharray="2 3" opacity=".7" vector-effect="non-scaling-stroke"/>`;
      out += `<circle cx="${x}" cy="${y}" r="4" fill="${good ? "#3df5a0" : "#ff4f7a"}" stroke="#0b0820"/>
              <rect x="${x - 26}" y="${y - 24}" width="52" height="14" rx="4" fill="#0b0820" stroke="${good ? "#3df5a0" : "#ff4f7a"}"/>
              <text x="${x}" y="${y - 14}" text-anchor="middle" fill="${good ? "#3df5a0" : "#ff4f7a"}">${lbl}</text>`;
    }
  });
  mine.filter(w => w.position && w.position.entry_time).forEach(w => {        // open trades
    const p = w.position, i = at(p.entry_time); if (i === null) return;
    const x = X(i), y = Y(c.close[i]), call = p.side === "CALL";
    out += tri(x, y + (call ? 10 : -10), call, wcol[w.name]) +
      `<text x="${x + 8}" y="${y + (call ? 24 : -18)}" fill="${wcol[w.name]}">${esc(w.name)} open ${money(p.open_pnl || 0)}</text>`;
  });
  $("chart").innerHTML = out;
}

async function tick() {
  try {
    const r = await fetch("state.json?_=" + Date.now(), {cache: "no-store"});
    if (r.ok) render(await r.json());
  } catch (e) { $("market").textContent = "bot offline"; }
}
let lastState = null;
const _render = render; render = st => { lastState = st; _render(st); };
window.addEventListener("resize", () => lastState && drawChart(lastState));
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
